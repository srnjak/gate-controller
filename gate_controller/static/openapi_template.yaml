openapi: 3.0.0
info:
  title: Gate Control API
  version: 1.0.0
  description: API for controlling and querying the status of a gate.

servers:
  - url: http://{host}:{port}
    description: Gate Control Server

paths:
  /gate/open:
    post:
      summary: Open the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Opening gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/close:
    post:
      summary: Close the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Closing gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/half:
    post:
      summary: Half open the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Half open gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/toggle:
    post:
      summary: Toggle the gate.
      description: Sends a signal to move the gate to the next state in its sequence.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Toggling gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/status:
    get:
      summary: Get the current status of the gate.
      description: >
        Reads the gate drive's status signals. `moving` while the gate is in
        motion, `closed` or `open` in an end position, and `intermediate`
        while the gate stands between the end positions.
      responses:
        '200':
          description: The current status of the gate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [open, closed, moving, intermediate]
                    example: closed
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >
            The status signals report a combination the gate cannot be in,
            such as both end positions at once.

  /openapi:
    get:
      summary: Get this OpenAPI document.
      responses:
        '200':
          description: The OpenAPI document of the Gate Control API.
          content:
            application/x-yaml:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  responses:
    Forbidden:
      description: The client address is not listed in `allowed_ips`.
      content:
        text/html:
          schema:
            type: string
            example: Forbidden
    CommandFailed:
      description: >
        Switching the relay or recording its state failed. The pulse may
        still have reached the gate drive, so read `/gate/status` before
        sending the command again.
    TooManyCommands:
      description: >
        Another gate command was accepted less than `command_cooldown`
        seconds ago, from this or another client. The command was not sent.
      headers:
        Retry-After:
          description: Seconds to wait before the next command is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: Too soon after the previous gate command; retry in 3 s.
