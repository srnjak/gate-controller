openapi: 3.0.0
info:
  title: Gate Control API
  version: 1.0.0
  description: API for controlling and querying the status of a gate.

servers:
  - url: http://{host}:{port}
    description: Gate Control Server

paths:
  /gate/open:
    post:
      summary: Open the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Opening gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/close:
    post:
      summary: Close the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Closing gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/half:
    post:
      summary: Half open the gate.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Half open gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/toggle:
    post:
      summary: Toggle the gate.
      description: Sends a signal to move the gate to the next state in its sequence.
      responses:
        '200':
          description: The relay pulse has been sent to the gate drive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Toggling gate command sent successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '429':
          $ref: '#/components/responses/TooManyCommands'

  /gate/status:
    get:
      summary: Get the current status of the gate.
      description: >
        Reads the gate drive's status signals. `moving` while the gate is in
        motion, `closed` or `open` in an end position, and `intermediate`
        while the gate stands between the end positions.
      responses:
        '200':
          description: The current status of the gate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [open, closed, moving, intermediate]
                    example: closed
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >
            The status signals report a combination the gate cannot be in,
            such as both end positions at once.

  /gate/events:
    get:
      summary: Stream every change of the gate state.
      description: >
        A server-sent event stream. The current state is sent on connect,
        then every accepted change of the status inputs, including movements
        started by a remote control; a heartbeat comment line follows every
        15 seconds while nothing changes. A `gate` event carries the state
        below; when both end position signals are active, an `error` event
        carries `seq`, `error`, `cooldownUntil` and `at` instead.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GateEvent'
        '403':
          $ref: '#/components/responses/Forbidden'

  /openapi:
    get:
      summary: Get this OpenAPI document.
      responses:
        '200':
          description: The OpenAPI document of the Gate Control API.
          content:
            application/x-yaml:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  schemas:
    GateEvent:
      type: object
      description: The data of a `gate` event.
      properties:
        seq:
          type: integer
          description: Increases by one with every event since the server started.
          example: 412
        status:
          type: string
          enum: [open, closed, moving, intermediate]
          example: moving
        direction:
          type: string
          nullable: true
          enum: [opening, closing, unknown]
          description: The direction while moving, null while at rest.
          example: opening
        cause:
          type: string
          nullable: true
          description: >
            `command:<name>` when the change follows a relay pulse of this
            server within 2 seconds, otherwise `external`; null for the state
            read when the server started.
          example: command:open
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            From when the next movement will be accepted, or null when it
            would be accepted now.
          example: '2026-11-23T18:04:16Z'
        at:
          type: string
          format: date-time
          description: When the change was first seen.
          example: '2026-11-23T18:04:11Z'
  responses:
    Forbidden:
      description: The client address is not listed in `allowed_ips`.
      content:
        text/html:
          schema:
            type: string
            example: Forbidden
    CommandFailed:
      description: >
        Switching the relay or recording its state failed. The pulse may
        still have reached the gate drive, so read `/gate/status` before
        sending the command again.
    TooManyCommands:
      description: >
        The gate is at rest and another movement started less than
        `command_cooldown` seconds ago, whatever started it. The command was
        not sent. A command that stops a moving gate is never rejected.
      headers:
        Retry-After:
          description: Seconds to wait before the next command is accepted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: Too soon after the previous gate movement; retry in 3 s.
