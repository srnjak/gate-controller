# Main Configuration File

# The host on which the Flask server will listen.
# Use '0.0.0.0' to listen on all available network interfaces.
host_listen: 0.0.0.0

# The port on which the Flask server will listen.
port: 5000

# Enable or disable debug mode.
# Set to 'true' to enable debug mode, which provides detailed error messages.
# Set to 'false' to disable debug mode in production.
debug: false

# List of allowed IP addresses or subnets that can access the server.
# You can specify IP addresses or subnets in CIDR notation.
# Example:
# allowed_ips:
#   - 192.168.1.0/24
#   - 10.0.0.1
allowed_ips:
  - 127.0.0.1
  - 192.168.0.0/24

# Number of reverse proxies in front of the server. The client address checked
# against allowed_ips is taken from the X-Forwarded-For header set by these
# proxies. Leave at 0 when clients connect to the server directly; otherwise
# any client could choose its own address with that header.
trusted_proxies: 0

# GPIO inputs (BCM numbering) wired to the gate drive's status outputs.
# Each output is a contact that connects the input to GND while the signal
# is active; the inputs use the internal pull-up resistor.
status_inputs:
  # Active while the gate is in the closed end position.
  closed: 27
  # Active while the gate is in the open end position.
  open: 22
  # Active while the gate is moving (the warning lamp output). It stays active
  # while the gate stands stopped part way, until a movement ends.
  moving: 17

# Seconds after which an active moving signal is taken for a gate at rest,
# for example one stopped part way by a remote control. Set it somewhat
# longer than a full travel between the end positions.
max_travel_time: 35

# Minimum seconds between two gate movements, whatever started them: a server
# command, the gate-controller command line or a remote control. A command
# that would start a movement sooner is rejected with 429 Too Many Requests.
# A command that stops a moving gate is never rejected. 0 turns the limit off.
command_cooldown: 5
